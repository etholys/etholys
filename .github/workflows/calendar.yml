name: eCalendar

on:
  pull_request:
    paths:
      - 'apps/web/lib/calendar/**'
      - 'apps/web/components/calendar/**'
      - 'apps/web/app/api/calendar/**'
      - 'apps/web/app/hub/calendar/**'
      - 'apps/web/tests/calendar-visibility.test.ts'
      - '.github/workflows/calendar.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/lib/calendar/**'
      - 'apps/web/components/calendar/**'
      - 'apps/web/app/api/calendar/**'
      - 'apps/web/app/hub/calendar/**'
      - 'apps/web/tests/calendar-visibility.test.ts'
      - '.github/workflows/calendar.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run test:calendar
